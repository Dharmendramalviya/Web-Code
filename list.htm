<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
    <style>
        ul>li{list-style-type: square;
        color: blue;}
        ol>li{list-style-type: lower-alpha;
        color: darkgreen; font-family: Curlz MT;}
        #a{color: darkmagenta;}
        #b{color: blueviolet;}
        
    </style>
</head>
<body><h2 style="color: darkred;">Unordered list</h2>
    <ul><li>hindi</li>
    <li>english</li>
    <li>maths</li>
    <li>science</li></ul>

    <h2 style="color: darkred;"> ordered list </h2>
    <ol><li>hindi</li>
    <li>english</li>
    <li>maths</li>
    <li>science</li></ol>

    <h2 style="color: darkred;">description list</h2>
    <dt id="a"><b>milk:</b></dt>
    <dd>milk -cow,baffalo and got.</dd>
    <dt id="b"><b>coffee:</b></dt>
    <dd>coffee available is cold and hot.</dd>
</body>
</html>
