<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Computer Course Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 30px;
    }

    .form-container {
      max-width: 600px;
      background: #fff;
      padding: 25px 30px;
      border-radius: 8px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #222;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-group label {
      font-weight: normal;
    }

    button {
      background: #007BFF;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Computer Course Registration Form</h2>
    <form id="registrationForm">

      <!-- Personal Details -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
      </div>

      <div class="form-group">
        <label for="fatherName">Father's Name *</label>
        <input type="text" id="fatherName" name="fatherName" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Date of Birth *</label>
          <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender" required>
            <option value="">--Select--</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <!-- Contact Information -->
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Address *</label>
        <textarea id="address" name="address" rows="3" required></textarea>
      </div>

      <!-- Course Selection -->
      <div class="form-group">
        <label>Choose Course(s) *</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="courses" value="DCA"> DCA</label>
          <label><input type="checkbox" name="courses" value="PGDCA"> PGDCA</label>
          <label><input type="checkbox" name="courses" value="Tally"> Tally</label>
          <label><input type="checkbox" name="courses" value="Basic Computer"> Basic Computer</label>
          <label><input type="checkbox" name="courses" value="CPCT"> CPCT</label>
        </div>
      </div>

      <!-- Old School Details -->
      <div class="form-group">
        <label for="schoolName">Previous School/College</label>
        <input type="text" id="schoolName" name="schoolName">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="lastClass">Last Class Passed</label>
          <input type="text" id="lastClass" name="lastClass" placeholder="e.g., 10th, 12th, B.A.">
        </div>

        <div class="form-group">
          <label for="rollNo">Roll Number</label>
          <input type="text" id="rollNo" name="rollNo">
        </div>
      </div>

      <div class="form-group">
        <label for="marks">Marks / Percentage</label>
        <input type="text" id="marks" name="marks" placeholder="e.g., 75% or 8.0 CGPA">
      </div>

      <!-- Submit -->
      <button type="submit">Submit Form</button>
    </form>
  </div>

</body>
</html>
