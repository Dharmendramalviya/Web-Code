<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student form</title>
</head>

<body style="color:(to right, #ff6b6b, #f7d794, #70a1ff, #7bed9f); background-color: rgb(87, 224, 224);"><form action=""><div style="border: 10px double black; margin: 5px;">
    <h2 style="border: 2px double black;">Student Registration Form</h2>
    <label for="rno"><b>Enrollment No:</b></label>
    <input type="text" id="rno" name="Enrollment" placeholder="Enrollment">
<br><br>
    <label for="fname"><b>First name:</b></label>
    <input type="text" id="fname" name="fname" placeholder=" First Name">
<br><br>
    <label for="lname"><b>Last name:</b></label>
    <input type="text" id="lname" name="lname" placeholder="Last Name">
<br><br>
    <label for="fathersname" ><b>father's name:</b></label>
    <input type="text" id="fathersname" name="fathersname" placeholder=" Father Name">
<br><br>
    <label for="dob"><b>Date of birth: </b></label>
    <input type="date" name="dob" id="dob" placeholder=" Date of Birth">
<br><br>
    <label for="mnumber"> <b>Mobile number:</b></label>
    <input type="text" size="2" value="+91">-
    <input type="text" size="12" id="mnumber" placeholder="Conact No." minlength="10" maxlength="10">
<br><br>
   <label for="emil"><b>Email:</b>      </label>
   <input type="email" name="email" placeholder="email@gmail.com">
<br><br>
     <label for="pwd"><b>Password:</b></label>
     <input type="password" name="pwd" placeholder="********" maxlength="10">
<br><br>
    <label for="gender"><b>Gender:</b></label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">female</label> 
<br><br>
    <label for="#"><b>Choose Department: </b> </label>

  <input type="checkbox" name="cse" id="cse">
  <label for="cse">CSE</label>

  <input type="checkbox" name="it" id="it">
  <label for="it">IT</label> 

  <input type="checkbox" name="ecs" id="ece">
  <label for="ece">ECE</label>

  <input type="checkbox" name="civil" id="civil">
  <label for="civil">CIVIL</label>
<br><br>
  <label for="course"><b>course:</b></label>
  <select name="course" id="course">
    <option value="select course"> Select course</option>
    <option value="dca">DCA</option>
    <option value="pgdca">PGDCA</option>
    <option value="tally">TALLY PRIME</option>
    <option value="cpct">CPCT</option>
    <option value="basic computer">BASIC COMPUTER</option>
  </select>
<br><br>
   <label for="photo"><b> Student Photo:</b></label>
   <input type="file" name="photo" id="photo">
     
<br><br>
    <label for="city"><b>City:</b></label>
    <input type="text" name="city" placeholder="City">
<br><br>
<label for="adr"><b>Address:</b></label>
<textarea name="adr" id="adr" placeholder="Address"></textarea>

</select>



<br><br>
    <button style="color: blue; margin: 10px 10px;"><b>submit</b></button>
</form> </div> 
</body>
</html>
