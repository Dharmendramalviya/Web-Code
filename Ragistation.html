<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Computer Course Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f7;
      padding: 30px;
    }

    .container {
      max-width: 800px;
      background-color: #fff;
      padding: 25px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    h3 {
      background: #007BFF;
      color: white;
      padding: 10px;
      border-radius: 5px;
      margin-top: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .checkbox-group label {
      font-weight: normal;
    }

    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Computer Course Registration Form</h2>

    <!-- Personal Details -->
    <div>
      <h3>1. Personal Details</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
      </div>

      <div class="form-group">
        <label for="fatherName">Father's Name *</label>
        <input type="text" id="fatherName" name="fatherName" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Date of Birth *</label>
          <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender" required>
            <option value="">--Select--</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Contact Information -->
    <div>
      <h3>2. Contact Information</h3>

      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>
      </div>
    </div>

    <!-- Address Information -->
    <div>
      <h3>3. Address Information</h3>

      <div class="form-group">
        <label for="address">Full Address *</label>
        <textarea id="address" name="address" rows="3" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">City *</label>
          <input type="text" id="city" name="city" required>
        </div>

        <div class="form-group">
          <label for="state">State *</label>
          <input type="text" id="state" name="state" required>
        </div>
      </div>

      <div class="form-group">
        <label for="pincode">PIN Code</label>
        <input type="text" id="pincode" name="pincode">
      </div>
    </div>

    <!-- Old School Details -->
    <div>
      <h3>4. Previous School / Qualification</h3>

      <div class="form-group">
        <label for="school">School / College Name</label>
        <input type="text" id="school" name="school">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="lastClass">Last Class Passed</label>
          <input type="text" id="lastClass" name="lastClass" placeholder="e.g., 10th, 12th, B.A.">
        </div>

        <div class="form-group">
          <label for="rollNo">Roll Number</label>
          <input type="text" id="rollNo" name="rollNo">
        </div>
      </div>

      <div class="form-group">
        <label for="marks">Marks / Percentage</label>
        <input type="text" id="marks" name="marks">
      </div>
    </div>

    <!-- Course Selection -->
    <div>
      <h3>5. Course Selection</h3>

      <div class="checkbox-group">
        <label><input type="checkbox" name="courses" value="DCA"> DCA</label>
        <label><input type="checkbox" name="courses" value="PGDCA"> PGDCA</label>
        <label><input type="checkbox" name="courses" value="Tally"> Tally</label>
        <label><input type="checkbox" name="courses" value="Basic Computer"> Basic Computer</label>
        <label><input type="checkbox" name="courses" value="CPCT"> CPCT</label>
      </div>
    </div>

    <!-- Submit -->
    <div>
      <button type="submit">Submit Registration</button>
    </div>
  </div>

</body>
</html>
